<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Market — Spot the Difference</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span id="game-title">🏮 Lantern Market</span>
      <span id="scene-name">Night Market</span>
    </div>
    <div class="hud-mid">
      <span id="counter" class="pill">Found 0 / 8</span>
      <span id="timer" class="pill">⏱ 2:30</span>
      <span id="score" class="pill">★ 0</span>
    </div>
    <div class="hud-right">
      <button id="hint-btn" type="button">💡 Hint (<span id="hints-left">3</span>)</button>
      <button id="restart-btn" type="button">↻ Restart</button>
    </div>
  </header>

  <canvas id="game" width="1280" height="640" aria-label="Spot the difference: two near-identical pictures side by side"></canvas>

  <footer id="bar">
    <span id="message">Find the differences! Click a difference on either picture.</span>
    <span id="keys">Click to mark · H hint · R restart · N next scene</span>
  </footer>

  <div id="overlay" class="hidden">
    <div id="overlay-card">
      <h1 id="overlay-title">Welcome</h1>
      <p id="overlay-text"></p>
      <div id="overlay-stats"></div>
      <button id="overlay-btn" type="button">Start playing</button>
    </div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
